packages:
  - packages/*
  - apps/*
  - examples/*

# Dependency install scripts are denied unless listed as true. These three come from Testcontainers' optional SSH and
# protobuf support and are not needed.
allowBuilds:
  cpu-features: false
  protobufjs: false
  ssh2: false

# One version of each shared dev tool across the workspace. Packages reference these with "catalog:".
catalog:
  '@arethetypeswrong/cli': ^0.18.5
  '@microsoft/api-extractor': ^7.60.1
  '@types/node': ^24.19.2
  discord-api-types: ^0.38.59
  discord.js: ^14.28.1
  fast-check: ^4.10.2
  publint: ^0.3.25
  tinybench: ^6.2.3
  tsdown: ^0.23.7
  typescript: ~6.0.3
  vitest: ^5.1.0
  zod: ^4.6.7

# Security patches for transitive dependencies whose parents haven't updated yet. Remove an entry once
# `pnpm why <name>` shows the patched version without it.
overrides:
  # GHSA-hmw2-7cc7-3qxx, reached through starlight-openapi > httpsnippet (docs build only)
  form-data@<4.0.6: ^4.0.6
  # GHSA-3g3m-2fjr-6pw4 (fixed in glob 14.0.2), reached through testcontainers > archiver (tests only).
  # archiver-utils only calls glob.sync, which glob 14 still has.
  archiver-utils>glob: ^14.0.2

# Exact versions released too recently to pass pnpm's minimum-release-age check. Remove an entry once it is old enough.
minimumReleaseAgeExclude:
  - discord-api-types@0.38.59
  - '@fastify/static@10.1.11'
  - '@astrojs/markdown-satteri@0.4.10'
  - '@astrojs/starlight@0.43.1'
  - '@astrojs/vite-plugin-astro@0.1.3'
  - astro@7.4.12
