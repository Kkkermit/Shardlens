name = "shardlens-worker-example"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
SHARDLENS_URL = "https://stats.example.com"

# Secrets are not kept here. Set them with:
#   npx wrangler secret put DISCORD_PUBLIC_KEY
#   npx wrangler secret put SHARDLENS_INGEST_KEY
# For `npx wrangler dev`, put the same two names in a .dev.vars file (see .dev.vars.example).
