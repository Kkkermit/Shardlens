name: integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  postgres:
    name: collector on PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [16, 17]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@shardlens/collector...
      # Testcontainers starts PostgreSQL in Docker; also runs the SDK → collector end-to-end test.
      - run: pnpm --filter @shardlens/collector test:int
        env:
          SHARDLENS_TEST_PG_IMAGE: postgres:${{ matrix.postgres }}-alpine

  mongodb:
    name: collector on MongoDB ${{ matrix.mongodb }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mongodb: ['7.0', '8.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@shardlens/collector...
      # The same suites as on PostgreSQL, on a standalone MongoDB server (no replica set): answers that differ fail.
      - run: pnpm --filter @shardlens/collector test:int:mongodb
        env:
          SHARDLENS_TEST_MONGO_IMAGE: mongo:${{ matrix.mongodb }}

  image:
    name: collector image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -f apps/collector/Dockerfile -t shardlens-collector:ci .
      - name: image runs as non-root
        run: test "$(docker inspect -f '{{.Config.User}}' shardlens-collector:ci)" = "10001:10001"
      - name: compose publishes no database port
        run: |
          if grep -A12 '^  postgres:' deploy/docker-compose.yml | grep -q '^    ports:'; then
            echo "PostgreSQL must not be published"; exit 1
          fi
