# Dashboard end to end: a real collector on PostgreSQL (Testcontainers) with seeded demo data, driven by Playwright.
# Every page is checked with axe (WCAG 2.1 AA and best practices, light and dark), plus XSS-as-text, CSP, sign-in,
# admin gating and the audit-mode flow.
name: e2e

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds the dashboard and the collector that serves it.
      - run: pnpm turbo run build --filter=@shardlens/collector...
      - run: pnpm --filter @shardlens/dashboard exec playwright install --with-deps chromium
      - run: pnpm --filter @shardlens/dashboard test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: apps/dashboard/test-results/
          retention-days: 7
