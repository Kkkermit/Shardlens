# Simulated installs (tests/sim): the published packages, packed and installed with npm into three bots that coding
# agents set up, each run against a fake Discord, with PostgreSQL, MySQL and MongoDB in Docker. Fails on a count that
# differs from what was sent, a leak of user data or secrets, an unclean shutdown or an unknown REST route.
name: sim

on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

jobs:
  installs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm sim
        env:
          TMPDIR: ${{ runner.temp }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sim-logs
          path: ${{ runner.temp }}/shardlens-sim-*/logs/
          retention-days: 7
