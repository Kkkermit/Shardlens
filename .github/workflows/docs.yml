# Builds the documentation site on every pull request (code samples type-check, no broken links) and deploys it to
# GitHub Pages from main. Pages must use "GitHub Actions" as its source (Settings → Pages).
name: docs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds the packages the docs read (schema JSON, collector OpenAPI, SDK source), then the site.
      # starlight-links-validator fails the build on any broken internal link.
      - run: pnpm turbo run build --filter=@shardlens/docs...
      - run: pnpm --filter @shardlens/docs typecheck
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
