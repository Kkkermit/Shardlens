# Changesets version PR + npm trusted publishing (OIDC, provenance). No npm token is ever stored.
# Switched off until the repository variable RELEASE_ENABLED is "true" (docs/adr/0008-release-gating.md).
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      collector: ${{ steps.collector.outputs.version }}
    environment: npm
    permissions:
      contents: write
      pull-requests: write
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          # No registry-url: it would inject NODE_AUTH_TOKEN, which overrides the OIDC exchange.
      # Trusted publishing needs npm 11.5.1 or later. The Node 24 the job runs on ships with it (npm 11.19 with
      # Node 24.22), so nothing is installed at run time; this stops the job if that ever stops being true.
      - name: npm is new enough for trusted publishing
        run: test "$(printf '%s\n' 11.5.1 "$(npm --version)" | sort -V | head -n 1)" = 11.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: pnpm release
          version-script: pnpm changeset version
      # The collector goes to npm too (embedded mode); its container image is published below.
      - id: collector
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED: ${{ steps.changesets.outputs.published-packages }}
        run: |
          version=$(node -e 'const p = JSON.parse(process.env.PUBLISHED).find((p) => p.name === "@shardlens/collector"); process.stdout.write(p ? p.version : "")')
          echo "version=$version" >> "$GITHUB_OUTPUT"

  image:
    needs: release
    if: needs.release.outputs.collector != ''
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/image.yml
    with:
      version: ${{ needs.release.outputs.collector }}
